name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  # Keep ordinary CI on the same engine-strict Node version as the vendored
  # Source Runtime and the release workflow.
  NODE_VERSION: "24.15.0"
  PYTHON_VERSION: "3.12"

jobs:
  frontend-test:
    name: Frontend Tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Biome lint check
        run: npm run lint:check

      - name: Check i18n catalog coverage
        run: npm run i18n:check

      - name: Run Vitest
        run: npm run test

      - name: Type check
        run: npx tsc -b

      - name: Build frontend
        run: npm run build

      - name: npm audit
        run: npm audit --audit-level moderate
        continue-on-error: true

  rust-check:
    name: Rust Check
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ./src-tauri
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri

      - name: Cargo check
        run: cargo check --all-targets

      - name: Cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Cargo test
        run: cargo test --all-targets

      - name: Cargo fmt check
        run: cargo fmt --check

  macos-arm-check:
    name: macOS ARM64 Check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri
          key: macos-aarch64

      - name: Install Node dependencies
        run: npm ci

      - name: Install Source Runtime workspace dependencies
        run: npm run runtime:install

      - name: Check Source Runtime
        run: |
          npm run runtime:typecheck
          npm run runtime:test

      - name: Source Runtime smoke test
        run: npm run smoke:runtime

      - name: Build Source Runtime sidecar
        run: npm run runtime:sea

      - name: Check i18n catalog coverage
        run: npm run i18n:check

      - name: Build frontend
        run: npm run build

      - name: Check Apple Silicon target
        run: cargo check --manifest-path src-tauri/Cargo.toml --target aarch64-apple-darwin
